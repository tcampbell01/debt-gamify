  <style>

    .subtitle{color:var(--muted);margin:9px 0 0;max-width:640px}

    .status strong{display:block;color:var(--ink);font-size:14px}
    .dot{display:inline-block;width:8px;height:8px;background:var(--red);border-radius:50%;margin-right:7px;box-shadow:0 0 0 4px var(--red-bg)}

    .notice strong{color:#4e3a13}.notice button{border:0;background:transparent;color:inherit;text-decoration:underline;cursor:pointer}

    .player-row{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:start}.level-tag{display:inline-flex;align-items:center;gap:8px;color:#dbe8ff;font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.level-orb{width:38px;height:38px;display:grid;place-items:center;clip-path:polygon(50% 0,61% 34%,98% 35%,68% 56%,79% 94%,50% 71%,21% 94%,32% 56%,2% 35%,39% 34%);background:var(--gold);color:#162447;font-size:14px}.quest-board h2{font:900 30px/1.05 Impact,"Arial Black",sans-serif;text-transform:uppercase;letter-spacing:.04em;margin-top:12px}.xp-label{display:flex;justify-content:space-between;color:#d3dffa;font-size:12px;margin:14px 0 6px}.xp-track{height:12px;background:#081d41;border:2px solid #5378b4;border-radius:2px;overflow:hidden}.xp-track span{display:block;height:100%;background:linear-gradient(90deg,#f3bd32,#ffe890)}.streak{text-align:right;color:#d5e1f6;font-size:12px}.streak strong{display:block;font:900 25px/1.1 Impact,"Arial Black",sans-serif;color:white;margin-bottom:5px;letter-spacing:.03em}

    .budget-layout{display:grid;grid-template-columns:1.35fr .65fr;gap:22px}.budget-list{border:1px solid var(--line);border-radius:9px;overflow:hidden}.budget-row{display:grid;grid-template-columns:1fr 130px 70px 34px;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}.budget-row:first-child{border-top:0}.budget-name{font-weight:800}.budget-name small{display:block;color:var(--muted);font-weight:500}.budget-amount{text-align:right;font-weight:900}.budget-due{text-align:center;color:var(--muted);font-size:12px}.delete-budget{border:0;background:var(--red-bg);color:var(--red);width:28px;height:28px;border-radius:6px;cursor:pointer;font-weight:900}.budget-form{background:var(--blue-bg);border:1px solid #b8ccec;border-radius:9px;padding:15px}.budget-form h3{margin:0 0 12px;font-size:15px}.field{display:grid;gap:4px;margin-top:9px}.field label{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.field input,.field select{width:100%;border:1px solid #aebed7;background:white;border-radius:7px;padding:9px;font:inherit;color:var(--ink)}.form-pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}.add-budget{width:100%;margin-top:12px;border:0;border-radius:7px;background:var(--red);color:white;padding:10px;font-weight:900;cursor:pointer}.budget-summary{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:2px solid var(--line)}.device-note{font-size:11px;color:var(--muted);margin:9px 0 0}

    .income-layout{display:grid;grid-template-columns:1.35fr .65fr;gap:22px}.income-row{display:grid;grid-template-columns:1fr 110px 110px 90px 32px;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}.income-row:first-child{border-top:0}.income-date{color:var(--muted);font-size:12px}.income-expected{background:var(--amber-bg);color:#835b0b}.income-received{background:var(--mint);color:var(--blue)}.income-status{border:0;border-radius:7px;padding:7px;font-size:11px;font-weight:900;cursor:pointer}.hero-button{border:0;border-radius:7px;background:var(--blue);color:white;padding:9px 12px;font-weight:900;cursor:pointer}.hero-button:disabled{opacity:.55;cursor:not-allowed}.connect-note{color:var(--muted);font-size:11px;margin-top:7px}
    details{margin-top:16px;border:1px dashed #bfc7bf;border-radius:14px;padding:13px 15px;background:rgba(255,255,255,.35)}summary{cursor:pointer;font-weight:800;color:var(--green)}
    details p,details ol{color:var(--muted);font-size:13px}code{background:#e6e8e3;padding:2px 5px;border-radius:5px}
    footer{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:12px;margin-top:18px;padding:0 4px}
    .mobile-nav{display:none}.mobile-action{border:0;background:var(--green);color:white;border-radius:11px;padding:9px 12px;font-weight:800;cursor:pointer}
    .fatal{max-width:720px;margin:80px auto;background:white;border:1px solid var(--red);border-radius:16px;padding:24px;color:var(--red)}
    @media(max-width:850px){.cash,.plan,.debts,.activity{grid-column:1/-1}.cash-layout,.game-grid,.budget-layout,.income-layout{grid-template-columns:1fr}header{display:block}.status{text-align:left;margin-top:14px}}
    @media(max-width:520px){body{padding-bottom:74px}.shell{padding:20px 14px 40px}.card{padding:17px}.notice{align-items:flex-start}.bar-row{grid-template-columns:86px 1fr}.bar-row strong{grid-column:2;text-align:right}.debt-item{grid-template-columns:34px 1fr}.debt-amount{grid-column:2;text-align:left}.cash-layout{gap:14px}.budget-row{grid-template-columns:1fr auto 28px}.budget-due{grid-column:1;text-align:left}.delete-budget{grid-column:3;grid-row:1}.payment-row,.income-row{grid-template-columns:1fr auto}.payment-value{text-align:right}.category-select,.payment-status{width:100%}.income-date{grid-column:1}.income-status{grid-column:1/-1}footer{display:block}.mobile-nav{position:fixed;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);left:10px;right:10px;bottom:10px;padding:7px;background:rgba(255,253,248,.94);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(30,45,35,.18);border-radius:16px}.mobile-nav a{display:grid;place-items:center;gap:1px;text-decoration:none;color:var(--muted);font-size:10px;font-weight:800;padding:4px}.mobile-nav a span{font-size:19px;line-height:1}.mobile-action{width:100%;margin-top:10px}}
  </style>

  <script>
  (() => {
    const raw = document.getElementById('ledger-data').textContent
      .replace('<!-- LEDGER_DATA_START -->','').replace('<!-- LEDGER_DATA_END -->','').trim();
    let data;
    try { data = JSON.parse(raw); }
    catch (error) {
      document.getElementById('app').innerHTML = `<div class="fatal"><h1>Ledger data needs attention</h1><p>The JSON between the LEDGER_DATA markers could not be read. Check commas, quotation marks, and brackets.</p><small>${escapeHtml(error.message)}</small></div>`;
      return;
    }
    try {
      const savedBudget=localStorage.getItem('debt-hero-budget-v1');
      if(savedBudget) data.monthly.bills=JSON.parse(savedBudget);
      const savedPayments=localStorage.getItem('debt-hero-payments-v1');
      if(savedPayments) data.payments=JSON.parse(savedPayments);
      const savedIncome=localStorage.getItem('debt-hero-income-v1');
      if(savedIncome) data.expectedIncome=JSON.parse(savedIncome);
    } catch(error) { console.warn('Saved budget could not be loaded.'); }

    const money = n => new Intl.NumberFormat('en-US',{style:'currency',currency:data.profile.currency||'USD',maximumFractionDigits:0}).format(n||0);
    const sum = xs => xs.reduce((n,x)=>n+(Number(x.amount)||0),0);
    const esc = escapeHtml;
    const income = sum(data.monthly.income||[]);
    const minimums = (data.debts||[]).reduce((n,d)=>n+(Number(d.minimumPayment)||0),0);
    const extra = Number(data.monthly.extraDebtPayment)||0;
    const totalDebt = (data.debts||[]).reduce((n,d)=>n+(Number(d.balance)||0),0);

    function project(debts, strategy) {
      let rows = debts.map((d,i)=>({...d,_i:i,balance:+d.balance||0}));
      let month=0, interest=0;
      while(rows.some(d=>d.balance>.01) && month<1200) {
        month++;
        let pool=extra;
        rows.forEach(d=>{ if(d.balance>0){ const it=d.balance*(+d.apr||0)/1200; d.balance+=it; interest+=it; }});
        rows.forEach(d=>{ if(d.balance>0){ const pay=Math.min(d.balance,+d.minimumPayment||0); d.balance-=pay; }});
        const active=rows.filter(d=>d.balance>.01).sort((a,b)=>strategy==='snowball'?a.balance-b.balance:(+b.apr||0)-(+a.apr||0));
        for(const d of active){ if(pool<=0) break; const pay=Math.min(pool,d.balance); d.balance-=pay; pool-=pay; }
      }
      const date=new Date(); date.setMonth(date.getMonth()+month);
      return {months:month,interest,finish:month>=1200?'Beyond projection':date.toLocaleDateString('en-US',{month:'short',year:'numeric'})};
    }

    function render(strategy=data.profile.strategy||'avalanche') {
      const bills=sum(data.monthly.bills||[]);
      const remaining=income-bills-minimums-extra;
      const ordered=[...(data.debts||[])].sort((a,b)=>strategy==='snowball'?(+a.balance)-(+b.balance):(+b.apr)-(+a.apr));
      const p=project(data.debts||[],strategy);
      const max=Math.max(income,bills,minimums,extra,1);
      const alerts=(data.alerts||[]).slice(0,8);
      const game=data.gamification||{};
      const paymentCategories=[...new Set(['Home','Utilities','Essentials','Transport','Insurance','Subscriptions','Debt Payment','Other',...(data.monthly.bills||[]).map(b=>b.category).filter(Boolean)])];
      const clearedByCategory=(data.payments||[]).filter(p=>p.status==='cleared').reduce((totals,p)=>{totals[p.category]=(totals[p.category]||0)+Number(p.amount||0);return totals;},{});
      const expectedIncomeTotal=(data.expectedIncome||[]).filter(x=>x.status==='expected').reduce((n,x)=>n+Number(x.amount||0),0);
      const receivedIncomeTotal=(data.expectedIncome||[]).filter(x=>x.status==='received').reduce((n,x)=>n+Number(x.amount||0),0);
      const xp=Math.max(0,+game.xp||0), nextXp=Math.max(xp+1,+game.nextLevelXp||1000), xpPct=Math.min(100,xp/nextXp*100);
      const boss=ordered[0];
      const bossPaid=boss?Math.max(0,Math.min(100,(1-(+boss.balance||0)/(+boss.originalBalance||+boss.balance||1))*100)):100;
      const checked=data.lastChecked?new Date(data.lastChecked).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'}):'Never';
      document.getElementById('app').innerHTML = `
        <header><div><div class="eyebrow">Financial Hero Command Center</div><h1>${esc(data.profile.name||'Your')} debt defense</h1><p class="subtitle">Take down debt villains, complete monthly missions, and build your financial superpower.</p></div><div class="status"><strong><span class="dot"></span>Mission intel updated</strong>${esc(checked)}</div></header>
        ${data.profile.isPlaceholder?`<div class="notice"><span><strong>Demo numbers are showing.</strong> Replace the marked JSON data before making financial decisions.</span><button onclick="document.getElementById('setup').open=true;document.getElementById('setup').scrollIntoView({behavior:'smooth'})">How to update</button></div>`:''}
        <section class="grid" id="overview">
          <article class="card quest-board" id="quest"><div class="player-row"><div><div class="level-tag"><span class="level-orb">${esc(game.level||1)}</span> Hero Rank ${esc(game.level||1)} · ${esc(game.title||'Rising Hero')}</div><h2>Your Debt Defense Mission</h2><div class="xp-label"><span>${xp.toLocaleString()} Hero Points</span><span>${(nextXp-xp).toLocaleString()} to Rank ${(Number(game.level)||1)+1}</span></div><div class="xp-track" aria-label="${xpPct.toFixed(0)}% to next hero rank"><span style="width:${xpPct}%"></span></div></div><div class="streak"><strong>⚡ ${esc(game.streakMonths||0)} months</strong>Power streak active</div></div>
            <div class="game-grid"><div class="boss"><div class="game-title"><span>⚠ Debt Villain</span><small>${bossPaid.toFixed(0)}% defeated</small></div>${boss?`<div class="boss-name">${esc(boss.name)}</div><div class="boss-health"><span>${money(boss.balance)} power remaining</span><span>${money(boss.originalBalance)} original threat</span></div><div class="health-track"><span style="width:${bossPaid}%"></span></div><div class="reward">★ Power-up unlocks at 50% defeated</div>`:'<div class="empty">All villains defeated. The city is debt-free!</div>'}</div>
            <div class="quests"><div class="game-title"><span>Monthly Missions</span><small>${(game.quests||[]).filter(q=>q.done).length}/${(game.quests||[]).length} complete</small></div>${(game.quests||[]).map(q=>`<div class="quest ${q.done?'done':''}"><span class="quest-check">${q.done?'✓':'○'}</span><span class="quest-name">${esc(q.name)}</span><span class="quest-xp">+${esc(q.xp)} HP</span></div>`).join('')}<div class="reward">★ Complete 6 missions to earn a Streak Shield</div></div></div>
          </article>
          <article class="card cash"><div class="card-head"><div><h2>Monthly cash position</h2><div class="kicker">After planned spending and debt payments</div></div><span class="month">${esc(data.monthly.label||'Current month')}</span></div>
            <div class="cash-layout"><div><div class="balance-label">Available after everything</div><div class="balance ${remaining<0?'negative':'positive'}">${money(remaining)}</div><div class="balance-note">${remaining<0?`Your plan is short by ${money(Math.abs(remaining))}. Reduce the extra debt payment or expenses before the month begins.`:`You have ${money(remaining)} of breathing room after the planned extra debt payment.`}</div></div>
            <div>${[['Income',income,'income'],['Bills',bills,'bill'],['Debt minimums',minimums,'minimum'],['Extra payoff',extra,'extra']].map(x=>`<div class="bar-row"><span>${x[0]}</span><div class="track"><div class="fill ${x[2]}" style="width:${Math.max(3,x[1]/max*100)}%"></div></div><strong>${money(x[1])}</strong></div>`).join('')}</div></div>
          </article>
          <article class="card plan"><div class="card-head"><div><h2>Payoff forecast</h2><div class="kicker">Switch strategies to compare</div></div></div>
            <div class="strategy"><button data-strategy="avalanche" class="${strategy==='avalanche'?'active':''}">Avalanche</button><button data-strategy="snowball" class="${strategy==='snowball'?'active':''}">Snowball</button></div>
            <div class="balance-label">Projected debt-free</div><div class="big-date">${esc(p.finish)}</div><div class="kicker">${p.months} months at current payments</div>
            <div class="metric"><span>Current debt</span><strong>${money(totalDebt)}</strong></div><div class="metric"><span>Projected interest</span><strong>${money(p.interest)}</strong></div>
          </article>
          <article class="card income-schedule" id="income"><div class="card-head"><div><h2>Income arrival schedule</h2><div class="kicker">Plan around irregular income without spending it before it clears</div></div><div><strong>${money(expectedIncomeTotal)} expected</strong><div class="kicker">${money(receivedIncomeTotal)} received</div></div></div>
            <div class="income-layout"><div><div class="payment-list">${(data.expectedIncome||[]).length?[...(data.expectedIncome||[])].sort((a,b)=>a.date.localeCompare(b.date)).map(item=>{const i=data.expectedIncome.indexOf(item);return `<div class="income-row"><div class="payment-name">${esc(item.source)}<small>${item.status==='received'?'Available cash':'Not counted as available yet'}</small></div><div class="payment-value">${money(item.amount)}</div><div class="income-date">${esc(new Date(item.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}))}</div><button class="income-status ${item.status==='received'?'income-received':'income-expected'}" data-income-status="${i}">${item.status==='received'?'✓ Received':'◷ Expected'}</button><button class="delete-budget" data-income-delete="${i}" aria-label="Remove ${esc(item.source)}">×</button></div>`}).join(''):'<div class="empty">No expected income added yet.</div>'}</div><p class="device-note">Expected payments appear in forecasts, but only received payments should increase “safe to pay today.”</p></div>
            <form class="budget-form" id="income-form"><h3>Add expected income</h3><div class="field"><label for="income-source">Source</label><input id="income-source" name="source" placeholder="e.g. Sept. 9 gig" required maxlength="60"></div><div class="form-pair"><div class="field"><label for="income-amount">Expected amount</label><input id="income-amount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="200.00" required></div><div class="field"><label for="income-date">Expected date</label><input id="income-date" name="date" type="date" required></div></div><button class="add-budget" type="submit">+ Add expected payment</button><p class="device-note">Saved privately in this browser on this device.</p></form></div>
          </article>
          <article class="card budget" id="budget"><div class="card-head"><div><h2>Budget mission planner</h2><div class="kicker">Add the expenses your cash must cover before attacking debt</div></div><strong>${money(bills)}/month</strong></div>
            <div class="budget-layout"><div><div class="budget-list">${(data.monthly.bills||[]).length?(data.monthly.bills||[]).map((b,i)=>`<div class="budget-row"><div class="budget-name">${esc(b.name)}<small>${esc(b.category||'Other')}</small></div><div class="budget-amount">${money(b.amount)}</div><div class="budget-due">Due day ${esc(b.dueDay||'—')}</div><button class="delete-budget" data-budget-index="${i}" aria-label="Remove ${esc(b.name)}">×</button></div>`).join(''):'<div class="empty">No budget items yet. Add your first expense.</div>'}</div><div class="budget-summary"><span>Monthly budget total</span><strong>${money(bills)}</strong></div></div>
            <form class="budget-form" id="budget-form"><h3>Add a budget item</h3><div class="field"><label for="budget-name">Expense name</label><input id="budget-name" name="name" placeholder="e.g. Car insurance" required maxlength="60"></div><div class="form-pair"><div class="field"><label for="budget-amount">Monthly amount</label><input id="budget-amount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" required></div><div class="field"><label for="budget-day">Due day</label><input id="budget-day" name="dueDay" type="number" inputmode="numeric" min="1" max="31" placeholder="15" required></div></div><div class="field"><label for="budget-category">Category</label><select id="budget-category" name="category"><option>Home</option><option>Utilities</option><option>Essentials</option><option>Transport</option><option>Insurance</option><option>Subscriptions</option><option>Other</option></select></div><button class="add-budget" type="submit">+ Add to mission plan</button><p class="device-note">Saved privately in this browser on this device. It is not committed to GitHub.</p></form></div>
          </article>
          <article class="card payments" id="payments"><div class="card-head"><div><h2>Payment inbox</h2><div class="kicker">Confirm what cleared and move each payment into its budget category</div></div><div><button class="hero-button" id="connect-bank">Connect bank</button><div class="connect-note">Secure Plaid link</div></div></div>
            <div class="payment-list">${(data.payments||[]).length?(data.payments||[]).map((p,i)=>`<div class="payment-row"><div class="payment-name">${esc(p.name)}<small>${esc(new Date(p.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}))}</small></div><div class="payment-value">${money(p.amount)}</div><select class="category-select" data-payment-category="${i}" aria-label="Category for ${esc(p.name)}">${paymentCategories.map(c=>`<option ${c===p.category?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="payment-status ${p.status==='cleared'?'cleared':'pending'}" data-payment-status="${i}">${p.status==='cleared'?'✓ Cleared':'◷ Pending'}</button></div>`).join(''):'<div class="empty">No payments found yet.</div>'}</div>
            <div class="payment-totals">${Object.entries(clearedByCategory).map(([category,total])=>`<span class="category-total">${esc(category)} · ${money(total)}</span>`).join('')}</div><p class="device-note">Changing a category or status saves it privately on this device. Payments are tracked against categories but are not subtracted twice from your planned monthly budget.</p>
          </article>
          <article class="card debts" id="debts"><div class="card-head"><div><h2>Payoff order</h2><div class="kicker">${strategy==='avalanche'?'Highest APR first · minimizes interest':'Smallest balance first · builds momentum'}</div></div><strong>${ordered.length} debts</strong></div>
            ${ordered.length?ordered.map((d,i)=>{const paid=Math.max(0,Math.min(100,(1-(+d.balance||0)/(+d.originalBalance||+d.balance||1))*100));return `<div class="debt-item"><div class="rank">${i+1}</div><div><div class="debt-name">${esc(d.name)}</div><div class="debt-meta">${(+d.apr||0).toFixed(2)}% APR · ${money(d.minimumPayment)} minimum · due day ${esc(d.dueDay||'—')}</div><div class="progress" aria-label="${paid.toFixed(0)}% paid"><span style="width:${paid}%"></span></div></div><div class="debt-amount">${money(d.balance)}<small>${paid.toFixed(0)}% paid</small></div></div>`}).join(''):'<div class="empty">No debts added yet.</div>'}
          </article>
          <aside class="card activity" id="activity"><div class="card-head"><div><h2>Recent activity</h2><div class="kicker">Newest updates first</div></div></div>
            ${alerts.length?alerts.map(a=>`<div class="alert"><div class="icon ${['info','ok','warn'].includes(a.type)?a.type:'info'}">${a.type==='ok'?'✓':a.type==='warn'?'!':'i'}</div><div><p>${esc(a.message)}</p><time>${esc(new Date(a.date).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'}))}</time></div></div>`).join(''):'<div class="empty">No activity yet.</div>'}
          </aside>
        </section>
        <details id="setup"><summary>Make this ledger yours</summary><ol><li>Open this file in a plain-text editor.</li><li>Replace the values between <code>LEDGER_DATA_START</code> and <code>LEDGER_DATA_END</code>. Keep valid JSON formatting.</li><li>Set <code>isPlaceholder</code> to <code>false</code>, save, and refresh this page.</li></ol><p>The strategy buttons preview both methods. To set the default for future visits, change <code>profile.strategy</code> to <code>avalanche</code> or <code>snowball</code>.</p><p><strong>On mobile:</strong> when this folder is served from a secure website, use your browser's “Add to Home Screen” option. The app will then open full-screen and keep its last loaded dashboard available offline. Scheduled email checks and phone alerts still come from your automation app.</p><button class="mobile-action" id="share-ledger">Share dashboard</button></details>
        <footer><span>Private by design · all data stays in this file</span><span>Projection is an estimate, not financial advice.</span></footer>`;
      document.querySelector('.mobile-nav')?.remove();
      document.body.insertAdjacentHTML('beforeend','<nav class="mobile-nav" aria-label="Ledger sections"><a href="#quest"><span>✦</span>Quest</a><a href="#budget"><span>▤</span>Budget</a><a href="#debts"><span>↘</span>Debts</a><a href="#activity"><span>◷</span>Activity</a></nav>');
      document.querySelectorAll('[data-strategy]').forEach(btn=>btn.addEventListener('click',()=>render(btn.dataset.strategy)));
      document.getElementById('budget-form')?.addEventListener('submit',event=>{
        event.preventDefault();
        const form=new FormData(event.currentTarget);
        const item={name:String(form.get('name')||'').trim(),amount:Number(form.get('amount')),category:String(form.get('category')||'Other'),dueDay:Number(form.get('dueDay'))};
        if(!item.name||item.amount<=0||item.dueDay<1||item.dueDay>31) return;
        data.monthly.bills.push(item);
        localStorage.setItem('debt-hero-budget-v1',JSON.stringify(data.monthly.bills));
        render(strategy);
        document.getElementById('budget')?.scrollIntoView({behavior:'smooth'});
      });
      document.querySelectorAll('[data-budget-index]').forEach(btn=>btn.addEventListener('click',()=>{
        data.monthly.bills.splice(Number(btn.dataset.budgetIndex),1);
        localStorage.setItem('debt-hero-budget-v1',JSON.stringify(data.monthly.bills));
        render(strategy);
      }));
      document.querySelectorAll('[data-payment-category]').forEach(select=>select.addEventListener('change',()=>{
        data.payments[Number(select.dataset.paymentCategory)].category=select.value;
        localStorage.setItem('debt-hero-payments-v1',JSON.stringify(data.payments));
        render(strategy);
      }));
      document.querySelectorAll('[data-payment-status]').forEach(btn=>btn.addEventListener('click',()=>{
        const payment=data.payments[Number(btn.dataset.paymentStatus)];
        payment.status=payment.status==='cleared'?'pending':'cleared';
        localStorage.setItem('debt-hero-payments-v1',JSON.stringify(data.payments));
        render(strategy);
      }));
      document.getElementById('income-form')?.addEventListener('submit',event=>{
        event.preventDefault();
        const form=new FormData(event.currentTarget);
        const item={source:String(form.get('source')||'').trim(),amount:Number(form.get('amount')),date:String(form.get('date')||''),status:'expected'};
        if(!item.source||item.amount<=0||!item.date) return;
        data.expectedIncome.push(item);
        localStorage.setItem('debt-hero-income-v1',JSON.stringify(data.expectedIncome));
        render(strategy);
        document.getElementById('income')?.scrollIntoView({behavior:'smooth'});
      });
      document.querySelectorAll('[data-income-status]').forEach(btn=>btn.addEventListener('click',()=>{
        const item=data.expectedIncome[Number(btn.dataset.incomeStatus)];
        item.status=item.status==='received'?'expected':'received';
        localStorage.setItem('debt-hero-income-v1',JSON.stringify(data.expectedIncome));
        render(strategy);
      }));
      document.querySelectorAll('[data-income-delete]').forEach(btn=>btn.addEventListener('click',()=>{
        data.expectedIncome.splice(Number(btn.dataset.incomeDelete),1);
        localStorage.setItem('debt-hero-income-v1',JSON.stringify(data.expectedIncome));
        render(strategy);
      }));
      document.getElementById('connect-bank')?.addEventListener('click',connectPlaid);
      document.getElementById('share-ledger')?.addEventListener('click', async () => {
        const share={title:'Debt & Cash Flow Ledger',text:`Current debt: ${money(totalDebt)} · projected debt-free: ${p.finish}`};
        try { if(navigator.share) await navigator.share(share); else await navigator.clipboard.writeText(`${share.title}\n${share.text}`); }
        catch(error) { if(error.name!=='AbortError') alert('Sharing is not available in this browser.'); }
      });
    }
    async function connectPlaid(){
      const api=String(data.appConfig?.plaidApiBase||'').replace(/\/$/,'');
      if(!api){ alert('Plaid is ready to configure. Deploy the AWS backend, then add its API URL to appConfig.plaidApiBase.'); return; }
      const button=document.getElementById('connect-bank'); button.disabled=true; button.textContent='Opening secure link…';
      try{
        if(!window.Plaid) await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.plaid.com/link/v2/stable/link-initialize.js';script.onload=resolve;script.onerror=reject;document.head.appendChild(script);});
        const response=await fetch(api+'/plaid/link-token',{method:'POST'}); if(!response.ok) throw new Error('Link token request failed');
        const {link_token}=await response.json();
        window.Plaid.create({token:link_token,onSuccess:async public_token=>{const exchange=await fetch(api+'/plaid/exchange-token',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({public_token})});if(!exchange.ok) alert('The account was not saved. Please try again.');else alert('Account connected. Transaction syncing can now begin.');},onExit:error=>{if(error) console.warn('Plaid Link closed with an error.');}}).open();
      }catch(error){alert('Plaid could not open. Check the AWS API configuration and try again.');}
      finally{button.disabled=false;button.textContent='Connect bank';}
    }
    function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
    render();
    if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  })();
  </script>
</body>
