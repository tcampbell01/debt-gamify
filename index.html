<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#215c42">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Ledger">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="ledger-icon.svg" type="image/svg+xml">
  <title>Debt &amp; Cash Flow Ledger</title>
  <style>
    :root {
      --ink:#17221c; --muted:#647169; --paper:#f3f0e8; --card:#fffdf8;
      --line:#d9ddd5; --green:#215c42; --green2:#3d8565; --mint:#dceade;
      --amber:#a8661b; --amber-bg:#f7e8c8; --red:#a13f36; --red-bg:#f4dcd7;
      --blue:#315e74; --blue-bg:#dce9ee; --shadow:0 16px 40px rgba(30,45,35,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button{font:inherit}
    .shell{max-width:1180px;margin:auto;padding:30px 24px 56px}
    header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:25px}
    .eyebrow{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--green2);margin-bottom:6px}
    h1{font:700 clamp(28px,4vw,46px)/1.05 Georgia,serif;letter-spacing:-.035em;margin:0}
    .subtitle{color:var(--muted);margin:9px 0 0;max-width:640px}
    .status{text-align:right;white-space:nowrap;color:var(--muted);font-size:13px}
    .status strong{display:block;color:var(--ink);font-size:14px}
    .dot{display:inline-block;width:8px;height:8px;background:var(--green2);border-radius:50%;margin-right:7px}
    .notice{display:flex;justify-content:space-between;align-items:center;gap:18px;border:1px solid #dbc78e;background:#fff4d7;border-radius:14px;padding:12px 16px;margin-bottom:16px;color:#6c521d}
    .notice strong{color:#4e3a13}.notice button{border:0;background:transparent;color:inherit;text-decoration:underline;cursor:pointer}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:21px}
    .cash{grid-column:span 8}.plan{grid-column:span 4}.debts{grid-column:span 8}.activity{grid-column:span 4}
    .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
    h2{font:700 21px/1.2 Georgia,serif;margin:0}.kicker{font-size:12px;color:var(--muted);margin-top:4px}
    .month{font-weight:700;font-size:13px;padding:7px 10px;background:#edf1eb;border-radius:10px}
    .cash-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center}
    .balance-label{font-size:13px;color:var(--muted)}
    .balance{font:700 clamp(38px,5vw,58px)/1 Georgia,serif;letter-spacing:-.04em;margin:5px 0 8px}
    .balance.negative{color:var(--red)}.balance.positive{color:var(--green)}
    .balance-note{max-width:430px;color:var(--muted);font-size:13px}
    .bar-row{display:grid;grid-template-columns:104px 1fr auto;gap:10px;align-items:center;margin:11px 0;font-size:13px}
    .track{height:9px;background:#e7e9e4;border-radius:20px;overflow:hidden}.fill{height:100%;border-radius:20px}.income{background:var(--green2)}.bill{background:#819289}.minimum{background:var(--blue)}.extra{background:var(--amber)}
    .strategy{display:flex;background:#e9ece7;border-radius:12px;padding:4px;margin-bottom:17px}
    .strategy button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;cursor:pointer;color:var(--muted);font-weight:700}
    .strategy button.active{background:var(--card);color:var(--green);box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .big-date{font:700 32px/1.05 Georgia,serif;margin:7px 0}.metric{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;margin-top:12px;color:var(--muted)}.metric strong{color:var(--ink)}
    .debt-item{display:grid;grid-template-columns:38px 1fr auto;gap:14px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
    .debt-item:first-of-type{border-top:0}.rank{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--mint);color:var(--green);font-weight:800}
    .debt-name{font-weight:800}.debt-meta{font-size:12px;color:var(--muted);margin-top:2px}.debt-amount{text-align:right;font-weight:800}.debt-amount small{display:block;color:var(--muted);font-weight:500}
    .progress{height:5px;background:#e8eae6;border-radius:9px;margin-top:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green2)}
    .empty{padding:28px 0;text-align:center;color:var(--muted)}
    .alert{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:14px 0;border-top:1px solid var(--line)}.alert:first-of-type{border-top:0}
    .icon{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;font-size:13px;font-weight:900}.icon.info{background:var(--blue-bg);color:var(--blue)}.icon.ok{background:var(--mint);color:var(--green)}.icon.warn{background:var(--amber-bg);color:var(--amber)}
    .alert p{margin:0;font-size:13px}.alert time{display:block;color:var(--muted);font-size:11px;margin-top:4px}
    details{margin-top:16px;border:1px dashed #bfc7bf;border-radius:14px;padding:13px 15px;background:rgba(255,255,255,.35)}summary{cursor:pointer;font-weight:800;color:var(--green)}
    details p,details ol{color:var(--muted);font-size:13px}code{background:#e6e8e3;padding:2px 5px;border-radius:5px}
    footer{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:12px;margin-top:18px;padding:0 4px}
    .mobile-nav{display:none}.mobile-action{border:0;background:var(--green);color:white;border-radius:11px;padding:9px 12px;font-weight:800;cursor:pointer}
    .fatal{max-width:720px;margin:80px auto;background:white;border:1px solid var(--red);border-radius:16px;padding:24px;color:var(--red)}
    @media(max-width:850px){.cash,.plan,.debts,.activity{grid-column:1/-1}.cash-layout{grid-template-columns:1fr}header{display:block}.status{text-align:left;margin-top:14px}}
    @media(max-width:520px){body{padding-bottom:74px}.shell{padding:20px 14px 40px}.card{padding:17px}.notice{align-items:flex-start}.bar-row{grid-template-columns:86px 1fr}.bar-row strong{grid-column:2;text-align:right}.debt-item{grid-template-columns:34px 1fr}.debt-amount{grid-column:2;text-align:left}.cash-layout{gap:14px}footer{display:block}.mobile-nav{position:fixed;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);left:10px;right:10px;bottom:10px;padding:7px;background:rgba(255,253,248,.94);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(30,45,35,.18);border-radius:16px}.mobile-nav a{display:grid;place-items:center;gap:1px;text-decoration:none;color:var(--muted);font-size:10px;font-weight:800;padding:4px}.mobile-nav a span{font-size:19px;line-height:1}.mobile-action{width:100%;margin-top:10px}}
  </style>
</head>
<body>
  <main class="shell" id="app" aria-live="polite"></main>

  <script id="ledger-data" type="application/json">
<!-- LEDGER_DATA_START -->
{
  "profile": { "name": "Your", "currency": "USD", "strategy": "avalanche", "isPlaceholder": true },
  "monthly": {
    "label": "September 2026",
    "income": [
      { "name": "Primary income", "amount": 5200 },
      { "name": "Other income", "amount": 350 }
    ],
    "bills": [
      { "name": "Housing", "amount": 1850 },
      { "name": "Utilities & internet", "amount": 310 },
      { "name": "Food & household", "amount": 680 },
      { "name": "Transport & insurance", "amount": 570 },
      { "name": "Subscriptions & other", "amount": 190 }
    ],
    "extraDebtPayment": 450
  },
  "debts": [
    { "name": "Credit Card A", "balance": 6840, "originalBalance": 9200, "apr": 24.99, "minimumPayment": 205, "dueDay": 14 },
    { "name": "Personal Loan", "balance": 11850, "originalBalance": 15000, "apr": 11.5, "minimumPayment": 392, "dueDay": 22 },
    { "name": "Credit Card B", "balance": 2350, "originalBalance": 4100, "apr": 18.9, "minimumPayment": 75, "dueDay": 8 }
  ],
  "alerts": [
    { "type": "info", "message": "Sample data is loaded. Replace it with your real numbers before relying on this plan.", "date": "2026-09-06T09:00:00-04:00" },
    { "type": "ok", "message": "Dashboard created and ready for automation.", "date": "2026-09-06T08:45:00-04:00" }
  ],
  "lastChecked": "2026-09-06T09:00:00-04:00"
}
<!-- LEDGER_DATA_END -->
  </script>

  <script>
  (() => {
    const raw = document.getElementById('ledger-data').textContent
      .replace('<!-- LEDGER_DATA_START -->','').replace('<!-- LEDGER_DATA_END -->','').trim();
    let data;
    try { data = JSON.parse(raw); }
    catch (error) {
      document.getElementById('app').innerHTML = `<div class="fatal"><h1>Ledger data needs attention</h1><p>The JSON between the LEDGER_DATA markers could not be read. Check commas, quotation marks, and brackets.</p><small>${escapeHtml(error.message)}</small></div>`;
      return;
    }

    const money = n => new Intl.NumberFormat('en-US',{style:'currency',currency:data.profile.currency||'USD',maximumFractionDigits:0}).format(n||0);
    const sum = xs => xs.reduce((n,x)=>n+(Number(x.amount)||0),0);
    const esc = escapeHtml;
    const income = sum(data.monthly.income||[]), bills = sum(data.monthly.bills||[]);
    const minimums = (data.debts||[]).reduce((n,d)=>n+(Number(d.minimumPayment)||0),0);
    const extra = Number(data.monthly.extraDebtPayment)||0;
    const remaining = income-bills-minimums-extra;
    const totalDebt = (data.debts||[]).reduce((n,d)=>n+(Number(d.balance)||0),0);

    function project(debts, strategy) {
      let rows = debts.map((d,i)=>({...d,_i:i,balance:+d.balance||0}));
      let month=0, interest=0;
      while(rows.some(d=>d.balance>.01) && month<1200) {
        month++;
        let pool=extra;
        rows.forEach(d=>{ if(d.balance>0){ const it=d.balance*(+d.apr||0)/1200; d.balance+=it; interest+=it; }});
        rows.forEach(d=>{ if(d.balance>0){ const pay=Math.min(d.balance,+d.minimumPayment||0); d.balance-=pay; }});
        const active=rows.filter(d=>d.balance>.01).sort((a,b)=>strategy==='snowball'?a.balance-b.balance:(+b.apr||0)-(+a.apr||0));
        for(const d of active){ if(pool<=0) break; const pay=Math.min(pool,d.balance); d.balance-=pay; pool-=pay; }
      }
      const date=new Date(); date.setMonth(date.getMonth()+month);
      return {months:month,interest,finish:month>=1200?'Beyond projection':date.toLocaleDateString('en-US',{month:'short',year:'numeric'})};
    }

    function render(strategy=data.profile.strategy||'avalanche') {
      const ordered=[...(data.debts||[])].sort((a,b)=>strategy==='snowball'?(+a.balance)-(+b.balance):(+b.apr)-(+a.apr));
      const p=project(data.debts||[],strategy);
      const max=Math.max(income,bills,minimums,extra,1);
      const alerts=(data.alerts||[]).slice(0,8);
      const checked=data.lastChecked?new Date(data.lastChecked).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'}):'Never';
      document.getElementById('app').innerHTML = `
        <header><div><div class="eyebrow">Personal finance, made visible</div><h1>${esc(data.profile.name||'Your')} debt &amp; cash flow</h1><p class="subtitle">One calm view of what comes in, what goes out, and the clearest path to becoming debt-free.</p></div><div class="status"><strong><span class="dot"></span>Last checked</strong>${esc(checked)}</div></header>
        ${data.profile.isPlaceholder?`<div class="notice"><span><strong>Demo numbers are showing.</strong> Replace the marked JSON data before making financial decisions.</span><button onclick="document.getElementById('setup').open=true;document.getElementById('setup').scrollIntoView({behavior:'smooth'})">How to update</button></div>`:''}
        <section class="grid" id="overview">
          <article class="card cash"><div class="card-head"><div><h2>Monthly cash position</h2><div class="kicker">After planned spending and debt payments</div></div><span class="month">${esc(data.monthly.label||'Current month')}</span></div>
            <div class="cash-layout"><div><div class="balance-label">Available after everything</div><div class="balance ${remaining<0?'negative':'positive'}">${money(remaining)}</div><div class="balance-note">${remaining<0?`Your plan is short by ${money(Math.abs(remaining))}. Reduce the extra debt payment or expenses before the month begins.`:`You have ${money(remaining)} of breathing room after the planned extra debt payment.`}</div></div>
            <div>${[['Income',income,'income'],['Bills',bills,'bill'],['Debt minimums',minimums,'minimum'],['Extra payoff',extra,'extra']].map(x=>`<div class="bar-row"><span>${x[0]}</span><div class="track"><div class="fill ${x[2]}" style="width:${Math.max(3,x[1]/max*100)}%"></div></div><strong>${money(x[1])}</strong></div>`).join('')}</div></div>
          </article>
          <article class="card plan"><div class="card-head"><div><h2>Payoff forecast</h2><div class="kicker">Switch strategies to compare</div></div></div>
            <div class="strategy"><button data-strategy="avalanche" class="${strategy==='avalanche'?'active':''}">Avalanche</button><button data-strategy="snowball" class="${strategy==='snowball'?'active':''}">Snowball</button></div>
            <div class="balance-label">Projected debt-free</div><div class="big-date">${esc(p.finish)}</div><div class="kicker">${p.months} months at current payments</div>
            <div class="metric"><span>Current debt</span><strong>${money(totalDebt)}</strong></div><div class="metric"><span>Projected interest</span><strong>${money(p.interest)}</strong></div>
          </article>
          <article class="card debts" id="debts"><div class="card-head"><div><h2>Payoff order</h2><div class="kicker">${strategy==='avalanche'?'Highest APR first · minimizes interest':'Smallest balance first · builds momentum'}</div></div><strong>${ordered.length} debts</strong></div>
            ${ordered.length?ordered.map((d,i)=>{const paid=Math.max(0,Math.min(100,(1-(+d.balance||0)/(+d.originalBalance||+d.balance||1))*100));return `<div class="debt-item"><div class="rank">${i+1}</div><div><div class="debt-name">${esc(d.name)}</div><div class="debt-meta">${(+d.apr||0).toFixed(2)}% APR · ${money(d.minimumPayment)} minimum · due day ${esc(d.dueDay||'—')}</div><div class="progress" aria-label="${paid.toFixed(0)}% paid"><span style="width:${paid}%"></span></div></div><div class="debt-amount">${money(d.balance)}<small>${paid.toFixed(0)}% paid</small></div></div>`}).join(''):'<div class="empty">No debts added yet.</div>'}
          </article>
          <aside class="card activity" id="activity"><div class="card-head"><div><h2>Recent activity</h2><div class="kicker">Newest updates first</div></div></div>
            ${alerts.length?alerts.map(a=>`<div class="alert"><div class="icon ${['info','ok','warn'].includes(a.type)?a.type:'info'}">${a.type==='ok'?'✓':a.type==='warn'?'!':'i'}</div><div><p>${esc(a.message)}</p><time>${esc(new Date(a.date).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'}))}</time></div></div>`).join(''):'<div class="empty">No activity yet.</div>'}
          </aside>
        </section>
        <details id="setup"><summary>Make this ledger yours</summary><ol><li>Open this file in a plain-text editor.</li><li>Replace the values between <code>LEDGER_DATA_START</code> and <code>LEDGER_DATA_END</code>. Keep valid JSON formatting.</li><li>Set <code>isPlaceholder</code> to <code>false</code>, save, and refresh this page.</li></ol><p>The strategy buttons preview both methods. To set the default for future visits, change <code>profile.strategy</code> to <code>avalanche</code> or <code>snowball</code>.</p><p><strong>On mobile:</strong> when this folder is served from a secure website, use your browser's “Add to Home Screen” option. The app will then open full-screen and keep its last loaded dashboard available offline. Scheduled email checks and phone alerts still come from your automation app.</p><button class="mobile-action" id="share-ledger">Share dashboard</button></details>
        <footer><span>Private by design · all data stays in this file</span><span>Projection is an estimate, not financial advice.</span></footer>`;
      document.querySelector('.mobile-nav')?.remove();
      document.body.insertAdjacentHTML('beforeend','<nav class="mobile-nav" aria-label="Ledger sections"><a href="#overview"><span>⌂</span>Overview</a><a href="#debts"><span>↘</span>Debts</a><a href="#activity"><span>◷</span>Activity</a><a href="#setup"><span>⚙</span>Setup</a></nav>');
      document.querySelectorAll('[data-strategy]').forEach(btn=>btn.addEventListener('click',()=>render(btn.dataset.strategy)));
      document.getElementById('share-ledger')?.addEventListener('click', async () => {
        const share={title:'Debt & Cash Flow Ledger',text:`Current debt: ${money(totalDebt)} · projected debt-free: ${p.finish}`};
        try { if(navigator.share) await navigator.share(share); else await navigator.clipboard.writeText(`${share.title}\n${share.text}`); }
        catch(error) { if(error.name!=='AbortError') alert('Sharing is not available in this browser.'); }
      });
    }
    function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
    render();
    if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  })();
  </script>
</body>
</html>
